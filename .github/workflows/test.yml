---
name: Run tests

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: clippy, rustfmt

      - name: Cache multiple paths
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ steps.toolchain.outputs.rustc_hash }}-${{ hashFiles('**/*.lock') }}

      - name: Clean cache if it's too big
        run: |
          du -hs target || exit 0
          target_size=$(du -ms target | awk '{print $1}')
          if [ "$target_size" -gt "5120" ]; then
            echo "size is ${target_size}, running cargo clean"
            cargo clean
          fi

      - name: Lint code
        uses: giraffate/clippy-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filter_mode: nofilter
          fail_on_error: true
          clippy_flags: --all-features

      - name: Check format
        run: cargo fmt -- --check

      - name: Run tests
        run: cargo test

      - name: Verify example-protocol can be compiled
        run: |
          pushd examples/example-protocol
          cargo run
          popd

      - name: Install Wasm target
        run: |
          rustup target add wasm32-unknown-unknown wasm32-wasip1

      - name: Verify generated Core Wasm guest compiles
        run: >-
          cargo test -p fp-bindgen --no-default-features
          --features wasmtime-core-wasm --test wasmtime_core_wasm_async

      - name: Verify example-plugin builds
        run: |
          pushd examples/example-plugin
          cargo build
          popd

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run end-to-end tests in Deno runtime
        run: |
          pushd examples/example-deno-runtime
          deno test --allow-read tests.ts
          popd

      - name: Run end-to-end tests in Wasmer 2 runtime
        run: |
          pushd examples/example-rust-wasmer2-runtime
          cargo test
          cargo test -F wasi
          popd

  wasmtime-core-wasm-targets:
    name: Core Wasm generator (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}

      - name: Compile the dependency-isolated Core Wasm generator
        run: >-
          cargo check -p fp-bindgen --no-default-features
          --features wasmtime-core-wasm --target ${{ matrix.target }}

      - name: Run native generated-linker lifecycle proof
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          cargo test -p fp-bindgen --no-default-features
          --features wasmtime45-integration --test wasmtime45_generated
